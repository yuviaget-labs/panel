name = "yuvi-panel"
main = "src/index.js"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "yuvi-panel-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# R2 Bucket binding (for file storage)
[[r2_buckets]]
binding = "R2"
bucket_name = "yuvi-panel-r2"

# Environment variables
[vars]
JWT_SECRET = "change-this-to-a-strong-random-secret-in-production"
